[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "palestra-mcp-deft"
version = "0.1.0"
description = "MCP server wrapper for DEFT (LLM-augmented decision-tree DNA classifier)"
requires-python = ">=3.10,<3.11"
dependencies = [
    "mcp >= 1.0",
    "pydantic >= 2.0",
    "pyyaml >= 6.0",
]

[project.scripts]
palestra-mcp-deft = "deft_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["deft_mcp*"]
