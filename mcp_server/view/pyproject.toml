[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "palestra-mcp-deft-view"
version = "0.1.0"
description = "Palestra view plugin: DEFT decision-tree visualizer"
requires-python = ">= 3.12"
dependencies = [
    "palestra[view] >= 0.1.0",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-xdist",
]

[project.entry-points."palestra.view.plugins"]
deft = "deft_view.plugin:DeftPlugin"

[tool.setuptools.packages.find]
where = ["src"]
include = ["deft_view*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
